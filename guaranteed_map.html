<!DOCTYPE html>
<html>
<head>
    <title>台灣AQI與避難所地圖</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .info {
            padding: 6px 8px;
            font: 14px/16px Arial, Helvetica, sans-serif;
            background: white;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .legend {
            line-height: 18px;
            color: #555;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        console.log("開始創建地圖...");
        
        // 創建地圖
        try {
            var map = L.map('map').setView([23.8, 120.9], 7);
            console.log("地圖創建成功");
            
            // 添加底圖
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            console.log("底圖添加成功");
            
            // AQI測站數據
            var aqiStations = [
                {name: "台北", lat: 25.0173, lon: 121.5395, aqi: 45},
                {name: "新北", lat: 25.0167, lon: 121.4667, aqi: 52},
                {name: "台中", lat: 24.1477, lon: 120.6736, aqi: 67},
                {name: "高雄", lat: 22.6273, lon: 120.3014, aqi: 150},
                {name: "台南", lat: 22.9999, lon: 120.2269, aqi: 41}
            ];
            
            // 避難所數據
            var shelters = [
                {name: "台北活動中心", lat: 25.0200, lon: 121.5400, indoor: true},
                {name: "新北公園", lat: 25.0100, lon: 121.4600, indoor: false},
                {name: "台中體育館", lat: 24.1500, lon: 120.6800, indoor: true},
                {name: "高雄廣場", lat: 22.6200, lon: 120.3100, indoor: false}
            ];
            
            // 添加AQI測站
            aqiStations.forEach(function(station, index) {
                console.log("添加AQI測站:", station.name);
                
                var color = station.aqi <= 50 ? '#00FF00' : 
                          station.aqi <= 100 ? '#FFFF00' : 
                          station.aqi <= 150 ? '#FF7F00' : '#FF0000';
                
                L.circleMarker([station.lat, station.lon], {
                    radius: 10,
                    fillColor: color,
                    color: '#000',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map)
                .bindPopup("<b>" + station.name + "</b><br>AQI: " + station.aqi + "<br>狀態: " + 
                         (station.aqi <= 50 ? '良好' : 
                          station.aqi <= 100 ? '普通' : 
                          station.aqi <= 150 ? '不健康' : '危險'));
            });
            
            // 添加避難所
            shelters.forEach(function(shelter, index) {
                console.log("添加避難所:", shelter.name);
                
                var icon = L.divIcon({
                    html: shelter.indoor ? 
                        '<div style="background: blue; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px;">室</div>' :
                        '<div style="background: green; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px;">外</div>',
                    iconSize: [20, 20],
                    className: 'custom-div-icon'
                });
                
                L.marker([shelter.lat, shelter.lon], {icon: icon})
                .addTo(map)
                .bindPopup("<b>" + shelter.name + "</b><br>類型: " + (shelter.indoor ? '室內避難所' : '室外避難所'));
            });
            
            // 添加圖例
            var legend = L.control({position: 'topright'});
            legend.onAdd = function (map) {
                var div = L.DomUtil.create('div', 'info legend');
                div.innerHTML = '<h4>圖例說明</h4>' +
                    '<div class="legend"><i style="background: #00FF00;"></i> AQI良好 (0-50)</div>' +
                    '<div class="legend"><i style="background: #FFFF00;"></i> AQI普通 (51-100)</div>' +
                    '<div class="legend"><i style="background: #FF7F00;"></i> AQI不健康 (101-150)</div>' +
                    '<div class="legend"><i style="background: #FF0000;"></i> AQI危險 (151+)</div>' +
                    '<div class="legend"><i style="background: blue;"></i> 室內避難所</div>' +
                    '<div class="legend"><i style="background: green;"></i> 室外避難所</div>';
                return div;
            };
            legend.addTo(map);
            
            console.log("地圖創建完成！");
            
        } catch (error) {
            console.error("地圖創建失敗:", error);
            document.body.innerHTML += '<div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: red; color: white; padding: 20px; border-radius: 10px;">地圖載入失敗: ' + error.message + '</div>';
        }
    </script>
</body>
</html>
